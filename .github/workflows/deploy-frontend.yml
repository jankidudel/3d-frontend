name: deploy-frontend

on:
  workflow_dispatch:
    # Hosted development is disabled. For future re-enablement, restore this
    # selector and wire job environment, STAGE and concurrency to its value.
    # inputs:
    #   environment:
    #     description: GitHub Environment and AWS stage to deploy
    #     required: true
    #     default: prod
    #     type: choice
    #     options:
    #       - prod
    #       - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: us-east-1
      STAGE: prod
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify AWS deployment configuration
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not available in the selected GitHub Environment."
            exit 1
          fi
          if ! printf '%s' "$AWS_DEPLOY_ROLE_ARN" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/.+'; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not a valid IAM role ARN."
            exit 1
          fi
          if ! printf '%s' "$AWS_ACCOUNT_ID" | grep -Eq '^[0-9]{12}$'; then
            echo "::error::AWS_ACCOUNT_ID must be the 12-digit target AWS account ID."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - run: npm ci
      - name: Configure the production contact CAPTCHA
        if: ${{ env.STAGE == 'prod' }}
        run: node --experimental-strip-types scripts/configure-contact-captcha.mts
      - name: Check browser audit environment
        run: google-chrome --version
      - run: npm run verify

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          retry-max-attempts: 3

      - name: Resolve frontend hosting resources
        run: |
          STACK_NAME="three-d-infra-$STAGE"
          FRONTEND_BUCKET="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)"
          FRONTEND_DISTRIBUTION_ID="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" --output text)"
          if [ -z "$FRONTEND_BUCKET" ] || [ -z "$FRONTEND_DISTRIBUTION_ID" ]; then
            echo "::error::The $STACK_NAME stack does not expose frontend deployment outputs. Run deploy-all for the initial deployment."
            exit 1
          fi
          echo "FRONTEND_BUCKET=$FRONTEND_BUCKET" >> "$GITHUB_ENV"
          echo "FRONTEND_DISTRIBUTION_ID=$FRONTEND_DISTRIBUTION_ID" >> "$GITHUB_ENV"

      - name: Upload immutable hashed assets
        run: |
          bash .github/scripts/deploy-frontend.sh \
            dist/3d-frontend/browser \
            "$FRONTEND_BUCKET" \
            "$FRONTEND_DISTRIBUTION_ID"

      - name: Verify production delivery
        run: npm run seo:live

      - name: Preserve SEO audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: technical-seo-prod
          path: tmp/seo
