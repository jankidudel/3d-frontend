<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" role="img"><title>Production cost to selling price</title><rect width="360" height="348" fill="#f8fafc"/><text x="18" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Production cost to selling price</text><rect x="14" y="50" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="73" font-family="sans-serif" font-size="15" fill="#0f172a">K = 39.192 CU production cost</text><text x="25" y="94" font-family="sans-serif" font-size="13" fill="#334155">Entered job total, never quantity × K</text><path d="M180 106 v12 m-4 -4 l4 4 4 -4" fill="none" stroke="#0369a1" stroke-width="2"/><rect x="14" y="120" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="143" font-family="sans-serif" font-size="15" fill="#0f172a">m = 30%, f = 5%, F = 0</text><text x="25" y="164" font-family="sans-serif" font-size="13" fill="#334155">Fee is on this modelled selling price P</text><path d="M180 176 v12 m-4 -4 l4 4 4 -4" fill="none" stroke="#0369a1" stroke-width="2"/><rect x="14" y="190" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="213" font-family="sans-serif" font-size="15" fill="#0f172a">P = K / (1 - m - f)</text><text x="25" y="234" font-family="sans-serif" font-size="13" fill="#334155">60.295384… CU; displayed 60.30</text><path d="M180 246 v12 m-4 -4 l4 4 4 -4" fill="none" stroke="#0369a1" stroke-width="2"/><rect x="14" y="260" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="283" font-family="sans-serif" font-size="15" fill="#0f172a">Fee 3.014769…; profit 18.088615…</text><text x="25" y="304" font-family="sans-serif" font-size="13" fill="#334155">Profit / selling price = 30%</text></svg>