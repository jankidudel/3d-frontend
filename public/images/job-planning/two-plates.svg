<svg xmlns="http://www.w3.org/2000/svg" width="360" height="278" viewBox="0 0 360 278" role="img"><title>Five parts across two plates</title><rect width="360" height="278" fill="#f8fafc"/><text x="18" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Five parts across two plates</text><rect x="14" y="50" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="73" font-family="sans-serif" font-size="15" fill="#0f172a">Plate A: 3 identical parts</text><text x="25" y="94" font-family="sans-serif" font-size="13" fill="#334155">One run, 90 g complete total, 4 hours</text><path d="M180 106 v12 m-4 -4 l4 4 4 -4" fill="none" stroke="#0369a1" stroke-width="2"/><rect x="14" y="120" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="143" font-family="sans-serif" font-size="15" fill="#0f172a">Plate B: 2 identical parts</text><text x="25" y="164" font-family="sans-serif" font-size="13" fill="#334155">One run, 70 g complete total, 3 hours</text><path d="M180 176 v12 m-4 -4 l4 4 4 -4" fill="none" stroke="#0369a1" stroke-width="2"/><rect x="14" y="190" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="213" font-family="sans-serif" font-size="15" fill="#0f172a">Order: 5 planned parts</text><text x="25" y="234" font-family="sans-serif" font-size="13" fill="#334155">160 g, 7 sliced hours; outcomes unknown</text></svg>