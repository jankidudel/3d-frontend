<svg xmlns="http://www.w3.org/2000/svg" width="360" height="278" viewBox="0 0 360 278" role="img"><title>Check before adding purge</title><rect width="360" height="278" fill="#f8fafc"/><text x="18" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Check before adding purge</text><rect x="14" y="50" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="73" font-family="sans-serif" font-size="15" fill="#0f172a">Subtotal: 80 g parts + supports</text><text x="25" y="94" font-family="sans-serif" font-size="13" fill="#334155">Purge absent: add separately reported 20 g</text><path d="M180 106 v12 m-4 -4 l4 4 4 -4" fill="none" stroke="#0369a1" stroke-width="2"/><rect x="14" y="120" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="143" font-family="sans-serif" font-size="15" fill="#0f172a">Complete estimate: 100 g</text><text x="25" y="164" font-family="sans-serif" font-size="13" fill="#334155">Already includes that same 20 g purge</text><path d="M180 176 v12 m-4 -4 l4 4 4 -4" fill="none" stroke="#0369a1" stroke-width="2"/><rect x="14" y="190" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="213" font-family="sans-serif" font-size="15" fill="#0f172a">Both represent 100 g consumption</text><text x="25" y="234" font-family="sans-serif" font-size="13" fill="#334155">Adding purge again would charge 120 g</text></svg>