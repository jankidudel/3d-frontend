<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" role="img"><title>Active work versus machine time</title><rect width="360" height="348" fill="#f8fafc"/><text x="18" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Active work versus machine time</text><rect x="14" y="50" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="73" font-family="sans-serif" font-size="15" fill="#0f172a">Preparation: 20 active minutes</text><text x="25" y="94" font-family="sans-serif" font-size="13" fill="#334155">Once for this fictional order</text><path d="M180 106 v12 m-4 -4 l4 4 4 -4" fill="none" stroke="#0369a1" stroke-width="2"/><rect x="14" y="120" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="143" font-family="sans-serif" font-size="15" fill="#0f172a">Plate handling: 10 minutes × 2</text><text x="25" y="164" font-family="sans-serif" font-size="13" fill="#334155">Each actual planned run incurs handling</text><path d="M180 176 v12 m-4 -4 l4 4 4 -4" fill="none" stroke="#0369a1" stroke-width="2"/><rect x="14" y="190" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="213" font-family="sans-serif" font-size="15" fill="#0f172a">Finishing: 5 minutes × 5 parts</text><text x="25" y="234" font-family="sans-serif" font-size="13" fill="#334155">Packing cost entered once separately</text><path d="M180 246 v12 m-4 -4 l4 4 4 -4" fill="none" stroke="#0369a1" stroke-width="2"/><rect x="14" y="260" width="332" height="55" rx="6" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="283" font-family="sans-serif" font-size="15" fill="#0f172a">Sliced machine duration: 7 hours</text><text x="25" y="304" font-family="sans-serif" font-size="13" fill="#334155">Not 7 hours of paid hands-on labour</text></svg>