<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title"><title id="title">Straight through-channel compared with a chamber behind a narrow access neck</title><rect width="720" height="260" rx="14" fill="#f5f8fa"/><style>text{font:16px sans-serif;fill:#173348}.title{font-weight:700}.part{fill:#d7e9f2;stroke:#24536d;stroke-width:3}.void{fill:#fff;stroke:#24536d;stroke-width:3}.arrow{stroke:#a34713;stroke-width:4;fill:none}</style><text x="24" y="30" class="title">A support decision needs an exit path</text><g transform="translate(35 49) scale(0.88)"><text x="0" y="0" class="title">Straight channel, open at both ends</text><rect class="part" x="10" y="35" width="285" height="120"/><rect class="void" x="10" y="75" width="285" height="40"/><path class="arrow" d="M25 95h250m0 0-14-9m14 9-14 9"/><text x="55" y="185">Direct removal direction</text></g><g transform="translate(390 49) scale(0.88)"><text x="0" y="0" class="title">Large chamber, 4 × 4 mm neck</text><rect class="part" x="10" y="35" width="285" height="120"/><path class="void" d="M10 91h65V55h185v100H75v-36H10z"/><path class="arrow" d="M20 105h130m0 0-14-9m14 9-14 9"/><text x="35" y="185">Reach and breakaway remain unproved</text></g><text x="24" y="246">Cross-section reveals material boundaries; it does not simulate tools, forces or surface damage.</text></svg>
