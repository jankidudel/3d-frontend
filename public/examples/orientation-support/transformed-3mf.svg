<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title"><title id="title">A translated ramp keeps its face directions while a rotated ramp changes its downward face</title><rect width="720" height="260" rx="14" fill="#f5f8fa"/><style>text{font:16px sans-serif;fill:#173348}.title{font-weight:700}.part{fill:#d7e9f2;stroke:#24536d;stroke-width:3}.down{stroke:#a34713;stroke-width:6}.arrow{stroke:#718494;stroke-width:3;fill:none}</style><text x="24" y="30" class="title">Apply 3MF placement transforms before normal classification</text><g transform="translate(55 60)"><text x="0" y="0">Translation only</text><path class="part" d="M20 145V65l190 50v30z"/><line class="down" x1="20" y1="145" x2="210" y2="145"/><path class="arrow" d="M35 35h150m0 0-12-8m12 8-12 8"/><text x="25" y="180">Bottom remains downward</text></g><g transform="translate(405 60)"><text x="0" y="0">180° rotation about X</text><path class="part" d="M20 65l190 50v30H20z" transform="rotate(180 115 105)"/><line class="down" x1="20" y1="65" x2="210" y2="115"/><path class="arrow" d="M100 25c70 0 70 75 20 75m0 0 12-8m-12 8 5 14"/><text x="10" y="180">Sloped face becomes downward</text></g><text x="24" y="242">Declared millimetres. The two public packages isolate translation from rotation.</text></svg>
