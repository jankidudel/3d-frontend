<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title"><title id="title">Bridge roof with two anchors compared with a cantilever roof with one root</title><rect width="720" height="260" rx="14" fill="#f5f8fa"/><style>text{font:16px sans-serif;fill:#173348}.title{font-weight:700}.part{fill:#d7e9f2;stroke:#24536d;stroke-width:3}.path{stroke:#a34713;stroke-width:5}.hint{stroke:#718494;stroke-width:2;stroke-dasharray:6 5}</style><text x="24" y="30" class="title">Compare the load path at the first underside layer</text><g transform="translate(35 55)"><text x="0" y="0" class="title">Bridge: two established anchors</text><path class="part" d="M15 165V75h65v90zM240 165V75h65v90zM15 75V45h290v30z"/><line class="path" x1="80" y1="80" x2="240" y2="80"/><text x="40" y="195">anchor</text><text x="245" y="195">anchor</text><text x="135" y="105">16 mm span</text></g><g transform="translate(390 55)"><text x="0" y="0" class="title">Overhang: one cantilever root</text><path class="part" d="M15 165V75h70v90zM15 75V45h230v30z"/><line class="path" x1="85" y1="80" x2="245" y2="80"/><line class="hint" x1="245" y1="80" x2="245" y2="165"/><text x="30" y="195">root</text><text x="120" y="105">16 mm extension</text></g><text x="24" y="242">The triangle angle screen can flag both undersides; the slicer owns extrusion-role classification.</text></svg>
