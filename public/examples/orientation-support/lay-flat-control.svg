<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title"><title id="title">Designed base, tilted imported bounds and slicer face alignment</title><rect width="720" height="260" rx="14" fill="#f5f8fa"/><style>text{font:16px sans-serif;fill:#173348}.title{font-weight:700}.part{fill:#d7e9f2;stroke:#24536d;stroke-width:3}.bed{stroke:#a34713;stroke-width:4}.arrow{stroke:#a34713;stroke-width:3;fill:none}</style><text x="24" y="30" class="title">One model, three separate observations</text><g transform="translate(30 49) scale(0.88)"><text x="0" y="0">Designed: 40 × 25 × 12 mm</text><path class="part" d="M15 75l120-25 75 37-120 25z"/><path class="part" d="M90 112v35l120-25V87z"/><text x="12" y="174">Intended 40 × 25 base</text></g><g transform="translate(255 49) scale(0.88) rotate(-11 100 85)"><text x="0" y="0">Imported: tilted and shifted</text><path class="part" d="M15 75l120-25 75 37-120 25z"/><path class="part" d="M90 112v35l120-25V87z"/><line class="bed" x1="0" y1="165" x2="220" y2="165"/></g><g transform="translate(500 49) scale(0.88)"><text x="0" y="0">Slicer: align chosen face</text><path class="part" d="M15 75h175v55H15z"/><line class="bed" x1="0" y1="130" x2="215" y2="130"/><path class="arrow" d="M105 40v25m0 0-8-12m8 12 8-12"/><text x="5" y="174">Then verify Z and layers</text></g><text x="24" y="246">Original deterministic diagram. Geometry and software steps are separate; no physical print result.</text></svg>
