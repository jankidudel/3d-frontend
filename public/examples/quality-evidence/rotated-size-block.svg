<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360"><title>Rotation changes global bounds, not edge lengths</title><desc>40 by 20 rectangle at zero and 45 degrees around Z. The rotated global X and Y spans both equal 60 divided by square root of two millimetres. Z remains 10.</desc><rect width="760" height="360" fill="#f8fafc"/><g fill="none" stroke="#075985" stroke-width="3"><rect x="90" y="125" width="160" height="80"/><polygon points="511.71572875,249.85281374 624.85281374,136.71572875 568.28427125,80.14718626 455.14718626,193.28427125"/></g><g fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"><rect x="90" y="125" width="160" height="80"/><rect x="455.1471862576143" y="80.14718625761431" width="169.70562748477138" height="169.70562748477138"/></g><g fill="#0f172a" font-family="sans-serif" font-size="17"><text x="80" y="70">Original: 0° around Z</text><text x="420" y="45">Rotated: 45° around Z</text><text x="96" y="240">X span: 40 mm</text><text x="96" y="266">Y span: 20 mm</text><text x="430" y="285">X and Y spans: 42.4264 mm</text><text x="430" y="311">Long edge stays 40 mm</text><text x="65" y="340">Analytical XY schematic; Z span stays 10 mm. Not a physical test.</text></g></svg>
