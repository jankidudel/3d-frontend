<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600"><title>Compare existing and increased findings</title><rect width="720" height="600" fill="#f4f8fb"/><text x="32" y="44" font-size="25" font-family="sans-serif" fill="#123c55">Compare existing and increased findings</text><rect x="24" y="76" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="108" font-family="sans-serif" font-size="24" fill="#123c55">Original ridge control</text><text x="40" y="144" font-family="sans-serif" font-size="20" fill="#123c55">24 triangles; two touching components</text><rect x="24" y="196" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="228" font-family="sans-serif" font-size="24" fill="#123c55">75% requested</text><text x="40" y="264" font-family="sans-serif" font-size="20" fill="#123c55">Actual output is measured, never assumed</text><rect x="24" y="316" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="348" font-family="sans-serif" font-size="24" fill="#123c55">50% requested</text><text x="40" y="384" font-family="sans-serif" font-size="20" fill="#123c55">Inspect duplicate and over-shared findings</text><rect x="24" y="436" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="468" font-family="sans-serif" font-size="24" fill="#123c55">Next action</text><text x="40" y="504" font-family="sans-serif" font-size="20" fill="#123c55">Reject, retain original, try an independent gentler target</text><text x="32" y="585" font-family="sans-serif" font-size="18" fill="#123c55">Original analytical schematic; no physical print test.</text></svg>