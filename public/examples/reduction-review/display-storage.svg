<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600"><title>Display rounding preserves stored decisions</title><rect width="720" height="600" fill="#f4f8fb"/><text x="32" y="44" font-size="25" font-family="sans-serif" fill="#123c55">Display rounding preserves stored decisions</text><rect x="24" y="76" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="108" font-family="sans-serif" font-size="24" fill="#123c55">Stored coordinate</text><text x="40" y="144" font-family="sans-serif" font-size="20" fill="#123c55">25.39999771118164</text><rect x="24" y="196" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="228" font-family="sans-serif" font-size="24" fill="#123c55">Human display</text><text x="40" y="264" font-family="sans-serif" font-size="20" fill="#123c55">25.4 mm</text><rect x="24" y="316" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="348" font-family="sans-serif" font-size="24" fill="#123c55">Boundary example</text><text x="40" y="384" font-family="sans-serif" font-size="20" fill="#123c55">20.0000001 displays 20; still greater than 20</text><rect x="24" y="436" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="468" font-family="sans-serif" font-size="24" fill="#123c55">Tiny negative coordinate</text><text x="40" y="504" font-family="sans-serif" font-size="20" fill="#123c55">-0.0000001 displays -1e-7, preserving its sign</text><text x="32" y="585" font-family="sans-serif" font-size="18" fill="#123c55">Original analytical schematic; no physical print test.</text></svg>