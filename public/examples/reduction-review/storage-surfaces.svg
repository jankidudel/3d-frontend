<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600"><title>Encoding and simplification answer different questions</title><rect width="720" height="600" fill="#f4f8fb"/><text x="32" y="44" font-size="25" font-family="sans-serif" fill="#123c55">Encoding and simplification answer different questions</text><rect x="24" y="76" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="108" font-family="sans-serif" font-size="24" fill="#123c55">Storage</text><text x="40" y="144" font-family="sans-serif" font-size="20" fill="#123c55">12 triangles: binary = 84 + 50 × 12 = 684 bytes</text><rect x="24" y="196" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="228" font-family="sans-serif" font-size="24" fill="#123c55">Coordinates</text><text x="40" y="264" font-family="sans-serif" font-size="20" fill="#123c55">20 is exact; decimal 0.1 rounds in Float32</text><rect x="24" y="316" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="348" font-family="sans-serif" font-size="24" fill="#123c55">Surfaces</text><text x="40" y="384" font-family="sans-serif" font-size="20" fill="#123c55">Simplification may remove or reshape detail</text><rect x="24" y="436" width="672" height="100" rx="10" fill="white" stroke="#527589"/><text x="40" y="468" font-family="sans-serif" font-size="24" fill="#123c55">Acceptance</text><text x="40" y="504" font-family="sans-serif" font-size="20" fill="#123c55">Bytes and triangle counts do not certify features</text><text x="32" y="585" font-family="sans-serif" font-size="18" fill="#123c55">Original analytical schematic; no physical print test.</text></svg>