<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600"><title>Equal bounds, missing narrow rib</title><rect width="720" height="600" fill="#f4f8fb"/><g font-family="sans-serif" fill="#123c55"><text x="24" y="38" font-size="26">Equal outer bounds; different local features</text><text x="24" y="74" font-size="22">Top views at one scale, 20 × 20 body</text><text x="28" y="112" font-size="23">Original: 36 triangles</text><text x="375" y="112" font-size="23">Revision: 24 triangles</text><rect x="28" y="134" width="280" height="280" fill="#d3e9ef" stroke="#123c55"/><rect x="375" y="134" width="280" height="280" fill="#d3e9ef" stroke="#123c55"/><rect x="42" y="372" width="28" height="28" fill="#087c9f"/><rect x="389" y="372" width="28" height="28" fill="#087c9f"/><rect x="154" y="286.6" width="28" height="1.4" fill="#ac3d22"/><circle cx="168" cy="287.3" r="24" fill="none" stroke="#ac3d22" stroke-width="2"/><path d="M168 311 L168 455 L28 455" fill="none" stroke="#ac3d22" stroke-width="2"/><text x="28" y="486" font-size="22">2 × 0.1 rib at (9, 9); height 0.2</text><text x="28" y="518" font-size="22">Marker stays; both Z spans are Float32(20.2)</text><text x="28" y="551" font-size="20">Hand-authored removal, not a simplifier output.</text><text x="28" y="582" font-size="20">Touching shells; no Boolean union or physical test.</text></g></svg>