<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600"><title>Independent candidate branches from retained original</title><rect width="720" height="600" fill="#f4f8fb"/><g font-family="sans-serif" fill="#123c55"><text x="26" y="42" font-size="26">Retain one original; choose three derivatives</text><rect x="170" y="70" width="380" height="90" rx="12" fill="white" stroke="#123c55"/><text x="214" y="108" font-size="25">Original bytes + geometry</text><text x="225" y="139" font-size="20">Never overwritten by a candidate</text><path d="M360 160 L360 187 L72 187 L72 451 M72 226 L170 226 M72 342 L170 342 M72 451 L170 451" stroke="#087c9f" stroke-width="3" fill="none"/><rect x="170" y="195" width="510" height="88" rx="10" fill="white" stroke="#123c55"/><text x="194" y="231" font-size="25">Encoding candidate</text><text x="194" y="263" font-size="20">Triangle records under Float32 storage</text><rect x="170" y="308" width="510" height="88" rx="10" fill="white" stroke="#123c55"/><text x="194" y="344" font-size="25">75% kept-triangle request</text><text x="194" y="376" font-size="20">Measure actual serialized output</text><rect x="170" y="421" width="510" height="88" rx="10" fill="white" stroke="#123c55"/><text x="194" y="457" font-size="25">50% kept-triangle request</text><text x="194" y="489" font-size="20">Starts from original, not 75% output</text><text x="26" y="554" font-size="22">Select, inspect, compare, then download exact bytes.</text><text x="26" y="584" font-size="19">Analytical workflow diagram; no automatic best candidate.</text></g></svg>