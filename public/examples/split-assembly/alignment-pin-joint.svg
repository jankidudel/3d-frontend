<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">Alignment dowel and socket dimensions</title>
  <desc id="description">Two mating blocks use a separate four millimetre dowel and four point three millimetre sockets. Labels identify insertion direction, engagement depth, end clearance, socket diameter and material around the socket.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a4b08"/></marker>
  </defs>
  <rect width="720" height="360" rx="24" fill="#f4f7fb"/>
  <g font-family="system-ui, sans-serif" fill="#173348">
    <text x="34" y="42" font-size="22" font-weight="700">Separate dowel in two blind sockets</text>
    <path d="M70 86H650V171H398V132H322V171H70Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <path d="M70 274H650V189H398V228H322V189H70Z" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <rect x="337" y="140" width="46" height="80" rx="20" fill="#facc15" stroke="#8a4b08" stroke-width="3"/>
    <line x1="360" y1="86" x2="360" y2="122" stroke="#8a4b08" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="380" y="108" font-size="15">insertion direction</text>
    <line x1="310" y1="132" x2="310" y2="171" stroke="#173348" stroke-width="2"/>
    <text x="168" y="154" font-size="15">socket depth 7 mm</text>
    <path d="M400 132H414M407 132V140M400 140H414" stroke="#173348" stroke-width="2" fill="none"/>
    <text x="424" y="138" font-size="15">end clearance</text>
    <path d="M400 144H414M407 144V171M400 171H414" stroke="#173348" stroke-width="2" fill="none"/>
    <text x="424" y="162" font-size="15">engagement depth</text>
    <line x1="337" y1="238" x2="383" y2="238" stroke="#173348" stroke-width="2"/>
    <text x="292" y="258" font-size="15">pin Ø 4.00 mm</text>
    <line x1="322" y1="292" x2="398" y2="292" stroke="#173348" stroke-width="2"/>
    <text x="274" y="314" font-size="15">socket Ø 4.30 mm</text>
    <text x="78" y="118" font-size="15">material around socket</text>
    <text x="78" y="246" font-size="15">engagement on both sides</text>
    <text x="360" y="344" font-size="14" text-anchor="middle">Illustrative geometry - dimensions are not a universal fit recommendation</text>
  </g>
</svg>
