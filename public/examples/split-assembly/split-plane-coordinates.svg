<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Source-coordinate split controls</title>
  <desc id="description">A cube from zero to twenty is cut at Z ten, while a shifted cube from minus five to fifteen is cut at Z five. Both cuts are fifty percent through the source span.</desc>
  <rect width="720" height="320" rx="24" fill="#f4f7fb"/>
  <g font-family="system-ui, sans-serif" fill="#173348">
    <text x="36" y="42" font-size="22" font-weight="700">50% uses the source bounds</text>
    <g transform="translate(35 82) scale(.85 1)">
      <rect x="0" y="0" width="220" height="180" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <line x1="-16" x2="236" y1="90" y2="90" stroke="#b45309" stroke-width="5" stroke-dasharray="10 8"/>
      <text x="0" y="-14" font-size="17" font-weight="700">Origin cube</text>
      <text x="236" y="10" font-size="15">Z = 20</text>
      <text x="236" y="96" font-size="15" font-weight="700">cut Z = 10</text>
      <text x="236" y="180" font-size="15">Z = 0</text>
    </g>
    <g transform="translate(385 82) scale(.85 1)">
      <rect x="0" y="0" width="220" height="180" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
      <line x1="-16" x2="236" y1="90" y2="90" stroke="#b45309" stroke-width="5" stroke-dasharray="10 8"/>
      <text x="0" y="-14" font-size="17" font-weight="700">Shifted cube</text>
      <text x="236" y="10" font-size="15">Z = 15</text>
      <text x="236" y="96" font-size="15" font-weight="700">cut Z = 5</text>
      <text x="236" y="180" font-size="15">Z = -5</text>
    </g>
    <text x="360" y="302" font-size="15" text-anchor="middle">plane = minimum + 0.50 × (maximum - minimum)</text>
  </g>
</svg>
