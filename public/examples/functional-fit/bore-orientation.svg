<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="title"><title id="title">Same bore geometry with two build directions</title><rect width="720" height="340" rx="12" fill="#f5f8fa"/><style>text{font:17px sans-serif;fill:#172d40} .part{fill:#d5e8f4;stroke:#234c69;stroke-width:3} .line{fill:none;stroke:#234c69;stroke-width:3} .dim{fill:none;stroke:#a34713;stroke-width:2} .label{font-weight:bold}</style><text x="24" y="32" class="label">Ideal 10 mm bore, 20 mm long: rigid 90-degree rotation</text><text x="30" y="70">Axis parallel to build Z</text><rect class="part" x="60" y="90" width="220" height="165"/><rect x="130" y="90" width="80" height="165" fill="white" stroke="#234c69" stroke-width="3"/><path class="line" d="M60 120H130 M210 120H280 M60 150H130 M210 150H280 M60 180H130 M210 180H280 M60 210H130 M210 210H280"/><text x="45" y="280">Section: repeated perimeter loops</text><text x="375" y="70">Axis perpendicular to build Z</text><rect class="part" x="405" y="90" width="220" height="165"/><circle cx="515" cy="175" r="65" fill="white" stroke="#234c69" stroke-width="3"/><path d="M464 134Q515 86 566 134" fill="none" stroke="#a34713" stroke-width="6"/><text x="385" y="280">Upper arc: overhang / bridge region</text><path class="dim" d="M680 250V110l-7 14m7-14 7 14"/><text x="665" y="95">Z</text><text x="24" y="320">Original schematic. Exaggerated gaps; no physical results.</text></svg>