<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="title"><title id="title">Diametral and radial clearance</title><rect width="720" height="340" rx="12" fill="#f5f8fa"/><style>text{font:17px sans-serif;fill:#172d40} .part{fill:#d5e8f4;stroke:#234c69;stroke-width:3} .line{fill:none;stroke:#234c69;stroke-width:3} .dim{fill:none;stroke:#a34713;stroke-width:2} .label{font-weight:bold}</style><text x="24" y="32" class="label">Concentric circular features, viewed along the axis</text><circle class="part" cx="190" cy="165" r="95"/><circle cx="190" cy="165" r="72" fill="#fff" stroke="#234c69" stroke-width="3"/><path class="dim" d="M95 165H285 M118 180H262 M262 210H285"/><text x="330" y="85">Hole H = 10.20 mm</text><text x="330" y="120">Pin P = 10.00 mm</text><text x="330" y="165">C = H - P = 0.20 mm</text><text x="330" y="210">Each radial gap = C/2</text><text x="330" y="245">Ideal geometry: 0.10 mm per side</text><text x="24" y="320">Original schematic. Exaggerated gaps; no physical results.</text></svg>