<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="title"><title id="title">Whole-part scaling versus a source feature edit</title><rect width="720" height="340" rx="12" fill="#f5f8fa"/><style>text{font:17px sans-serif;fill:#172d40} .part{fill:#d5e8f4;stroke:#234c69;stroke-width:3} .line{fill:none;stroke:#234c69;stroke-width:3} .dim{fill:none;stroke:#a34713;stroke-width:2} .label{font-weight:bold}</style><text x="24" y="32" class="label">Source feature edit preserves unrelated dimensions</text><rect class="part" x="45" y="100" width="150" height="110"/><circle cx="120" cy="155" r="25" fill="white" stroke="#234c69" stroke-width="3"/><text x="40" y="75">Original</text><rect class="part" x="265" y="94" width="166" height="122"/><circle cx="348" cy="155" r="28" fill="white" stroke="#234c69" stroke-width="3"/><text x="255" y="75">Global scale</text><rect class="part" x="525" y="100" width="150" height="110"/><circle cx="600" cy="155" r="35" fill="white" stroke="#234c69" stroke-width="3"/><text x="510" y="75">Local hole edit</text><text x="40" y="260">Hole and outer size</text><text x="250" y="260">Every dimension changes</text><text x="500" y="260">Less wall around the hole</text><text x="24" y="320">Original schematic. Exaggerated gaps; no physical results.</text></svg>