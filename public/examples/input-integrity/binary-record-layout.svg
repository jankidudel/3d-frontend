<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260"><title>Standard binary STL layout and three different endings</title><rect width="720" height="260" fill="#f8fafc"/><g font-family="sans-serif" font-size="14" fill="#172a3a">
    <text x="20" y="28" font-size="18" font-weight="bold">Standard binary STL: 84 + 50 × N bytes</text>
    <g stroke="#075985" stroke-width="2"><rect x="20" y="55" width="180" height="55" fill="#e0f2fe"/><rect x="200" y="55" width="120" height="55" fill="#fff"/><rect x="320" y="55" width="375" height="55" fill="#e0f2fe"/></g>
    <text x="35" y="78">80-byte header</text><text x="35" y="99">bytes 0-79</text><text x="210" y="78">4-byte count</text><text x="210" y="99">bytes 80-83</text><text x="335" y="78">N facet records × 50 bytes</text><text x="335" y="99">starts at byte 84; includes attribute bytes</text>
    <text x="20" y="145">684 bytes, N = 12: complete reference</text>
    <text x="20" y="174">683 bytes, N = 12: one byte missing from final record</text>
    <text x="20" y="203">584 bytes, N = 10: complete file with a deliberately open cube surface</text>
    <text x="20" y="242">Byte offsets are zero-based. Diagram widths are schematic, not proportional.</text></g></svg>
