<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title"><title id="title">Min and max location matters as well as width</title><rect width="720" height="260" rx="12" fill="#f3f7fa"/><g font-family="sans-serif" font-size="18" fill="#173348"><text x="24" y="32">Hypothetical X coordinate review (mm)</text><path d="M40 190H680" stroke="#173348" stroke-width="3"/><rect x="40" y="60" width="440" height="110" fill="#d9eaf0" stroke="#165675"/><text x="65" y="100">Entered X=0..220</text><rect x="500" y="110" width="20" height="60" fill="#a74c25"/><text x="495" y="90">Path 230..240</text><text x="28" y="220">0</text><text x="450" y="220">220</text><text x="540" y="150">10 mm wide</text><text x="24" y="250">Small width does not establish an in-bounds location.</text></g></svg>