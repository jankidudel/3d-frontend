<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title"><title id="title">Sequential clearance in plan and side views</title><rect width="720" height="260" rx="12" fill="#f3f7fa"/><g font-family="sans-serif" font-size="18" fill="#173348"><text x="24" y="30">Conceptual plan view</text><text x="390" y="30">Conceptual side view</text><rect x="35" y="75" width="65" height="65" fill="#165675"/><rect x="200" y="75" width="65" height="65" fill="#165675"/><rect x="165" y="48" width="135" height="120" fill="none" stroke="#a74c25" stroke-width="3" stroke-dasharray="7 4"/><text x="25" y="200">Footprint ≠ head clearance</text><rect x="410" y="130" width="70" height="55" fill="#165675"/><rect x="565" y="80" width="70" height="105" fill="#165675"/><path d="M395 115H660" stroke="#a74c25" stroke-width="10"/><text x="400" y="220">Height, gantry and order matter</text><text x="24" y="250">Use exact slicer/profile checks; no universal clearance radius.</text></g></svg>