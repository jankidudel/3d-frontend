<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="title desc"><title id="title">Preserve or translate coordinates</title><desc id="desc">Mathematical schematic. Translation changes location; span stays 20 mm. No rotation or scale.</desc><rect width="720" height="600" rx="16" fill="#edf3f8"/><g font-family="sans-serif" fill="#172b40"><text x="30" y="52" font-size="32">Preserve or translate coordinates</text><rect x="40" y="88" width="640" height="88" rx="10" fill="white" stroke="#405b75" stroke-width="3"/><text x="65" y="144" font-size="32">Source X=40..60</text><path d="M360 177v29m-8 -8 8 8 8-8" stroke="#405b75" fill="none" stroke-width="3"/><rect x="40" y="208" width="640" height="88" rx="10" fill="white" stroke="#405b75" stroke-width="3"/><text x="65" y="264" font-size="32">Preserve X=40..60</text><path d="M360 297v29m-8 -8 8 8 8-8" stroke="#405b75" fill="none" stroke-width="3"/><rect x="40" y="328" width="640" height="88" rx="10" fill="white" stroke="#405b75" stroke-width="3"/><text x="65" y="384" font-size="32">Translate -40: X=0..20</text><text x="30" y="480" font-size="27">Translation changes location; span stays 20 mm.</text><text x="30" y="511" font-size="27">No rotation or scale.</text><text x="30" y="575" fill="#405b75" font-size="23">InspectMesh schematic · no physical print test</text></g></svg>