<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc"><title id="title">One, two and three face edge incidence</title><desc id="desc">Each panel highlights the same edge in dark blue. One, two or three triangular wedges meet it.</desc><rect width="720" height="260" rx="18" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#17324f" font-size="17" text-anchor="middle"><text x="120" y="38">Boundary: 1 face</text><text x="360" y="38">Ordinary: 2 faces</text><text x="600" y="38">Over-shared: 3 faces</text></g><g fill="#b9dcf1" stroke="#4682aa" stroke-width="2"><path d="M90 128 L150 128 L120 67 Z"/><path d="M330 128 L390 128 L360 67 Z"/><path d="M330 128 L390 128 L360 190 Z"/><path d="M570 128 L630 128 L600 67 Z"/><path d="M570 128 L630 128 L575 190 Z"/><path d="M570 128 L630 128 L625 190 Z"/></g><g stroke="#123e67" stroke-width="7" stroke-linecap="round"><path d="M90 128h60 M330 128h60 M570 128h60"/></g><g font-family="Arial,sans-serif" fill="#17324f" font-size="15" text-anchor="middle"><text x="120" y="226">Open edge</text><text x="360" y="226">Shared edge</text><text x="600" y="226">Over-shared edge</text></g></svg>
