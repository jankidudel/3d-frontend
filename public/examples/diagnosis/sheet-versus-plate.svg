<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">Sheet compared with a closed thin plate</title><desc id="desc">A flat two-triangle sheet on the left has exposed perimeter edges. The plate on the right shows separate front and back faces connected by four side walls.</desc><rect width="720" height="280" rx="18" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#17324f" font-size="18" text-anchor="middle"><text x="175" y="38">Open sheet</text><text x="525" y="38">Closed plate</text></g><path d="M70 175 L235 175 L280 100 L115 100 Z" fill="#b9dcf1" stroke="#165b87" stroke-width="4"/><path d="M115 100L235 175" stroke="#165b87" stroke-dasharray="6 5"/><path d="M425 175 L590 175 L635 100 L470 100 Z" fill="#9ccce7" stroke="#165b87" stroke-width="3"/><path d="M425 175 L425 192 L590 192 L590 175 M590 192L635 117L635 100 M425 192L470 117L635 117" fill="#6faacc" stroke="#165b87" stroke-width="3"/><path d="M470 100L470 117" stroke="#165b87" stroke-width="3"/><g font-family="Arial,sans-serif" fill="#17324f" font-size="16" text-anchor="middle"><text x="175" y="236">1 surface, exposed perimeter</text><text x="525" y="236">Front + back + 4 closed sides</text></g></svg>
