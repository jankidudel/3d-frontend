<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Plain cube, cube with hidden sheet, and intentional channel</title><desc id="desc">Cross-section diagrams show a plain closed cube, an isolated internal divider inside the same outline, and a through-channel bounded by inner walls.</desc><rect width="720" height="300" rx="18" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#17324f" font-size="17" text-anchor="middle"><text x="120" y="38">Plain cube</text><text x="360" y="38">Extra internal sheet</text><text x="600" y="38">Intended channel</text></g><g fill="#b9dcf1" stroke="#165b87" stroke-width="4"><rect x="55" y="75" width="130" height="150"/><rect x="295" y="75" width="130" height="150"/><path fill-rule="evenodd" d="M535 75h130v150H535z M580 75v150h40V75z"/></g><path d="M315 151h90" stroke="#c84b44" stroke-width="6"/><g font-family="Arial,sans-serif" fill="#17324f" font-size="15" text-anchor="middle"><text x="120" y="264">Closed outer boundary</text><text x="360" y="264">Detached two-face divider</text><text x="600" y="264">Inner walls define void</text></g></svg>
