<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
  <title>Source position compared with centered slicer placement</title>
  <rect width="720" height="280" fill="#f8fafc"/>
  <g font-family="system-ui" fill="#183247" font-size="16">
    <text x="40" y="30" font-weight="700">Source coordinates, X/Y in mm</text>
    <text x="390" y="30" font-weight="700">Tested center operation</text>
    <text x="40" y="256" font-size="13">STL: X230..250, Y20..40, Z-5..15</text>
    <text x="390" y="256" font-size="13">PrusaSlicer 2.9.6 G-code: centred on bed</text>
  </g>
  <rect x="40" y="45" width="200" height="180" fill="white" stroke="#64748b" stroke-width="2"/>
  <rect x="390" y="45" width="200" height="180" fill="white" stroke="#64748b" stroke-width="2"/>
  <g font-family="system-ui" font-size="12" fill="#475569">
    <text x="40" y="242">X0</text><text x="218" y="242">X200</text>
    <text x="390" y="242">X0</text><text x="568" y="242">X200</text>
  </g>
  <rect x="270" y="190" width="20" height="20" fill="#b45309"/>
  <path d="M238 201H266" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="480" y="126" width="20" height="20" fill="#0e7490"/>
  <path d="M304 135H372" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#64748b"/></marker></defs>
</svg>
