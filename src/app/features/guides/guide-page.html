<main class="page guide-page">
  <article>
    <p class="eyebrow">{{ guide.eyebrow }}</p>
    <h1>{{ guide.heading }}</h1>
    <div class="guide-body" [innerHTML]="guide.html"></div>
    @if (guide.faqs.length > 0) {
      <section class="guide-faq">
        <h2>FAQ</h2>
        @for (faq of guide.faqs; track faq.question) {
          <h3>{{ faq.question }}</h3>
          <p>{{ faq.answer }}</p>
        }
      </section>
    }
  </article>
  <app-newsletter-signup
    title="New tools for better prints"
    description="Occasional updates when InspectMesh adds useful tools and guides. No spam."
    idPrefix="guide-subscribe"
  />
</main>
