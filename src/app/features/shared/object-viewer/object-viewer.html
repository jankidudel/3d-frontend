<div
  #container
  class="viewer-container"
  [class.is-expanded]="isFallbackExpanded()"
>
  <div
    #viewport
    class="viewport"
    role="img"
    [attr.aria-label]="ariaLabel()"
  ></div>
  <div class="viewer-action-row">
    <div class="viewer-file-actions">
      <button class="button button-secondary" type="button" (click)="reset()">
        Reset view
      </button>
      <button
        class="button button-secondary"
        type="button"
        (click)="chooseAnother.emit()"
      >
        Choose another file
      </button>
    </div>
    <div class="viewer-controls" aria-label="Viewer controls">
      @if (!preserveVertexColors()) {
        <label class="color-control">
          <span>Model colour</span>
          <input
            type="color"
            [value]="modelColor()"
            (input)="onColorChange($event)"
          />
        </label>
      }
      <button
        type="button"
        aria-label="Zoom out"
        title="Zoom out"
        (click)="zoom(1.2)"
      >
        -
      </button>
      <button
        type="button"
        aria-label="Zoom in"
        title="Zoom in"
        (click)="zoom(0.8)"
      >
        +
      </button>
      <button
        type="button"
        aria-label="Rotate model 90 degrees clockwise"
        title="Rotate model 90 degrees clockwise"
        (click)="rotateClockwise()"
      >
        <svg
          class="rotate-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <g transform="translate(24 0) scale(-1 1)">
            <path d="M7 8a7 7 0 1 1-1 6" />
            <path d="M7 4v4h4" />
          </g>
        </svg>
      </button>
      <button
        type="button"
        [attr.aria-label]="
          isExpanded() ? 'Close expanded viewer' : 'Expand viewer'
        "
        [title]="isExpanded() ? 'Close expanded viewer' : 'Expand viewer'"
        (click)="toggleFullscreen()"
      >
        {{ isExpanded() ? '×' : '⛶' }}
      </button>
    </div>
  </div>
</div>
