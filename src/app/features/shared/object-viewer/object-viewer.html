<div #container class="viewer-container">
  <div
    #viewport
    class="viewport"
    role="img"
    [attr.aria-label]="ariaLabel()"
  ></div>
  <div class="viewer-action-row">
    <div class="viewer-file-actions">
      <button class="button button-secondary" type="button" (click)="reset()">
        Reset view
      </button>
      <button
        class="button button-secondary"
        type="button"
        (click)="chooseAnother.emit()"
      >
        Choose another file
      </button>
    </div>
    <div class="viewer-controls" aria-label="Viewer controls">
      <label class="color-control">
        <span>Model colour</span>
        <input
          type="color"
          [value]="modelColor()"
          (input)="onColorChange($event)"
        />
      </label>
      <button
        type="button"
        aria-label="Zoom out"
        title="Zoom out"
        (click)="zoom(1.2)"
      >
        -
      </button>
      <button
        type="button"
        aria-label="Zoom in"
        title="Zoom in"
        (click)="zoom(0.8)"
      >
        +
      </button>
      <button
        type="button"
        aria-label="Toggle full screen"
        title="Toggle full screen"
        (click)="toggleFullscreen()"
      >
        ⛶
      </button>
    </div>
  </div>
</div>
