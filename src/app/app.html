<header class="site-header">
  <a class="brand" routerLink="/">
    <img ngSrc="/logo.webp" width="48" height="48" alt="" priority />
    <span>3D Quality Tools</span>
  </a>
  <nav aria-label="Main navigation">
    <a routerLink="/stl-volume-calculator" routerLinkActive="active"
      >STL Volume</a
    >
    <a routerLink="/stl-dimensions-checker" routerLinkActive="active"
      >STL Dimensions</a
    >
    <a routerLink="/stl-quality-check" routerLinkActive="active"
      >STL Quality Check</a
    >
  </nav>
</header>

<router-outlet />

<footer class="site-footer">
  <p>Simple, browser-friendly tools for better 3D prints.</p>
  <nav class="footer-links" aria-label="Legal and cookie settings">
    <a routerLink="/privacy">Privacy</a>
    <a routerLink="/cookies">Cookies</a>
    <button type="button" (click)="consent.changeChoice()">
      Cookie settings
    </button>
  </nav>
</footer>

<app-cookie-consent-banner />
