<header class="site-header">
  <a class="brand" [routerLink]="['/']" (click)="closeMenus()">
    <img ngSrc="/logo.webp" width="48" height="48" alt="" priority />
    <span>3D Quality Tools</span>
  </a>
  <button
    class="mobile-nav-toggle"
    type="button"
    [attr.aria-expanded]="mobileNavOpen"
    aria-controls="main-navigation"
    (click)="toggleMobileNav()"
  >
    Menu
  </button>
  <nav
    id="main-navigation"
    aria-label="Main navigation"
    [class.mobile-nav-open]="mobileNavOpen"
  >
    <div class="tools-disclosure">
      <a
        class="tools-trigger"
        [routerLink]="['/', routePath.AllTools]"
        (click)="closeMenus()"
        >Tools</a
      >
      <div id="tools-menu" class="tools-menu" aria-label="Tools">
        <a
          [routerLink]="['/', routePath.AllTools]"
          routerLinkActive="active"
          (click)="closeMenus()"
          >All 3D tools</a
        >
        <a
          class="tools-group-heading"
          [routerLink]="['/', routePath.Tools]"
          (click)="closeMenus()"
          >STL tools</a
        >
        <a
          [routerLink]="['/', routePath.Viewer]"
          routerLinkActive="active"
          (click)="closeMenus()"
          >STL Viewer</a
        >
        <a
          [routerLink]="['/', routePath.QualityCheck]"
          routerLinkActive="active"
          (click)="closeMenus()"
          >STL Quality Checker</a
        >
        <a
          [routerLink]="['/', routePath.WatertightChecker]"
          routerLinkActive="active"
          (click)="closeMenus()"
          >STL Watertight Checker</a
        >
        <a
          [routerLink]="['/', routePath.ManifoldChecker]"
          routerLinkActive="active"
          (click)="closeMenus()"
          >STL Manifold Checker</a
        >
        <a
          [routerLink]="['/', routePath.TriangleCounter]"
          routerLinkActive="active"
          (click)="closeMenus()"
          >STL Triangle Counter</a
        >
        <a
          [routerLink]="['/', routePath.DimensionsChecker]"
          routerLinkActive="active"
          (click)="closeMenus()"
          >STL Dimensions Checker</a
        >
        <a
          [routerLink]="['/', routePath.VolumeCalculator]"
          routerLinkActive="active"
          (click)="closeMenus()"
          >STL Volume Calculator</a
        >
        <a
          class="tools-group-heading"
          [routerLink]="['/', routePath.ThreeMfTools]"
          (click)="closeMenus()"
          >3MF tools</a
        >
        <a
          [routerLink]="['/', routePath.ThreeMfQualityCheck]"
          routerLinkActive="active"
          (click)="closeMenus()"
          >3MF Quality Checker</a
        >
      </div>
    </div>
  </nav>
</header>

<router-outlet />

<footer class="site-footer">
  <p>Simple, browser-friendly tools for better 3D prints.</p>
  <nav class="footer-links" aria-label="Legal and cookie settings">
    <a [routerLink]="['/', routePath.Privacy]">Privacy</a>
    <a [routerLink]="['/', routePath.Cookies]">Cookies</a>
    <button type="button" (click)="consent.changeChoice()">
      Cookie settings
    </button>
  </nav>
</footer>

<app-cookie-consent-banner />
