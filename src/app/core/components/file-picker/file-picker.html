<div class="picker">
  <label class="choose" [for]="configuration().accept">{{
    selectedFile() ? 'Choose another file' : configuration().label
  }}</label>
  <input
    #fileInput
    [id]="configuration().accept"
    type="file"
    [accept]="configuration().accept"
    (change)="onFileChange($event)"
  />
  <p class="hint" aria-live="polite">{{ configuration().selectionHint }}</p>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  @if (selectedFile(); as file) {
    <dl class="file-details" aria-live="polite">
      <div>
        <dt>File</dt>
        <dd>{{ file.name }}</dd>
      </div>
      <div>
        <dt>Size</dt>
        <dd>{{ formatSize(file.size) }}</dd>
      </div>
    </dl>
  }
</div>
