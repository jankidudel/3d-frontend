<footer class="site-footer">
  <app-newsletter-signup
    title="Newsletter"
    description="Get occasional updates on new tools and practical 3D-print guides."
    idPrefix="site-footer-subscribe"
    [compact]="true"
    [showSuccessOnlyAfterCurrentSubscription]="true"
    placeholder="Email address"
    buttonLabel="Subscribe"
  />

  <div class="footer-content">
    <p>Simple, browser-friendly tools for better 3D prints.</p>
    <nav class="footer-links" aria-label="Site and legal links">
      <a [routerLink]="['/', routePath.Examples]">Examples</a>
      <a [routerLink]="['/', routePath.Methods]">Methods and processing</a>
      <a [routerLink]="['/', routePath.Privacy]" routerLinkActive="active"
        >Privacy</a
      >
      <a [routerLink]="['/', routePath.Cookies]" routerLinkActive="active"
        >Cookies</a
      >
      <button type="button" (click)="consent.changeChoice()">
        Cookie settings
      </button>
      <a [routerLink]="['/', routePath.Contact]" routerLinkActive="active"
        >Contact</a
      >
    </nav>
  </div>
</footer>
