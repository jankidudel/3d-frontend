<section
  class="newsletter-signup card"
  [class.newsletter-signup--compact]="compact()"
  [attr.aria-labelledby]="compact() ? null : idPrefix() + '-title'"
  [attr.aria-label]="compact() ? 'Newsletter signup' : null"
>
  @if (showSuccessMessage()) {
    <p class="subscription-success" role="status">Successfully subscribed.</p>
  } @else {
    @if (!compact()) {
      <h2 [id]="idPrefix() + '-title'">{{ title() }}</h2>
    }
    <p>{{ description() }}</p>
    <app-subscription-form
      [idPrefix]="idPrefix()"
      [placeholder]="placeholder()"
      [buttonLabel]="buttonLabel()"
      (subscriptionSucceeded)="showSuccess()"
    />
  }
</section>
