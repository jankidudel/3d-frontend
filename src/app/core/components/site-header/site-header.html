<header class="site-header">
  <a class="brand" [routerLink]="['/']" (click)="closeMenus()">
    <img ngSrc="/logo.webp" width="48" height="48" alt="" priority />
    <span>3D Quality Tools</span>
  </a>
  <button
    class="mobile-nav-toggle"
    type="button"
    [attr.aria-expanded]="mobileNavOpen"
    aria-controls="main-navigation"
    aria-label="Toggle main navigation"
    (click)="toggleMobileNav()"
  >
    <span class="hamburger-icon" aria-hidden="true"
      ><span></span><span></span><span></span
    ></span>
    <span>Menu</span>
  </button>
  <nav
    id="main-navigation"
    aria-label="Main navigation"
    [class.mobile-nav-open]="mobileNavOpen"
  >
    <div
      #toolsDisclosure
      class="tools-disclosure"
      (mouseenter)="openToolsMenu()"
      (mouseleave)="scheduleToolsMenuClose()"
    >
      <button
        class="tools-trigger"
        [class.active]="toolsActive()"
        [attr.aria-expanded]="toolsMenuOpen"
        aria-controls="tools-menu"
        type="button"
        (click)="toggleToolsMenu()"
      >
        Tools <span class="chevron" aria-hidden="true">▾</span>
      </button>
      <div
        id="tools-menu"
        class="tools-menu"
        [class.tools-menu-open]="toolsMenuOpen"
        aria-label="Tools"
      >
        <section
          class="tools-menu-featured"
          aria-labelledby="featured-tools-title"
        >
          <h2 id="featured-tools-title" class="tools-menu-section-title">
            3D tools - Featured tools
          </h2>
          <app-menu-link
            label="3D Print Cost Calculator"
            [route]="routePath.PrintCostCalculator"
            (selected)="closeMenus()"
          />
          <app-menu-link
            label="Tolerance & Clearance"
            [route]="routePath.ToleranceCalculator"
            (selected)="closeMenus()"
          />
          <app-menu-link
            label="Shrinkage Calculator"
            [route]="routePath.ShrinkageCalculator"
            (selected)="closeMenus()"
          />
          <app-menu-link
            label="Orientation Planner"
            [route]="routePath.OrientationPlanner"
            (selected)="closeMenus()"
          />
          <app-menu-link
            label="Bed Layout Planner"
            [route]="routePath.BedLayoutPlanner"
            (selected)="closeMenus()"
          />
        </section>
        <section
          class="tools-menu-formats"
          aria-labelledby="file-format-tools-title"
        >
          <h2 id="file-format-tools-title" class="tools-menu-section-title">
            Tools by file format
          </h2>
          <div class="tools-menu-group">
            <app-menu-link
              label="STL tools"
              [route]="routePath.Tools"
              [variant]="menuLinkVariant.Heading"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Viewer"
              [route]="routePath.Viewer"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Quality Checker"
              [route]="routePath.QualityCheck"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Print Preflight Checker"
              [route]="routePath.StlPrintPreflight"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Repair Tool"
              [route]="routePath.StlRepair"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Watertight Checker"
              [route]="routePath.WatertightChecker"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Manifold Checker"
              [route]="routePath.ManifoldChecker"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Dimensions Checker"
              [route]="routePath.DimensionsChecker"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Scale Tool"
              [route]="routePath.StlScaleTool"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Wall Thickness Checker"
              [route]="routePath.StlWallThicknessChecker"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Overhang Checker"
              [route]="routePath.StlOverhangChecker"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Splitter"
              [route]="routePath.StlSplitter"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Volume Calculator"
              [route]="routePath.VolumeCalculator"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL Triangle Counter"
              [route]="routePath.TriangleCounter"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL File Size Reducer"
              [route]="routePath.StlFileSizeReducer"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="STL to 3MF Converter"
              [route]="routePath.StlToThreeMfConverter"
              (selected)="closeMenus()"
            />
          </div>
          <div class="tools-menu-group">
            <app-menu-link
              label="3MF tools"
              [route]="routePath.ThreeMfTools"
              [variant]="menuLinkVariant.Heading"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Viewer"
              [route]="routePath.ThreeMfViewer"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Quality Checker"
              [route]="routePath.ThreeMfQualityCheck"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Print Preflight Checker"
              [route]="routePath.ThreeMfPrintPreflight"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Repair Tool"
              [route]="routePath.ThreeMfRepair"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Watertight Checker"
              [route]="routePath.ThreeMfWatertightChecker"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Manifold Checker"
              [route]="routePath.ThreeMfManifoldChecker"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Dimensions Checker"
              [route]="routePath.ThreeMfDimensionsChecker"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Wall Thickness Checker"
              [route]="routePath.ThreeMfWallThicknessChecker"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Overhang Checker"
              [route]="routePath.ThreeMfOverhangChecker"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Volume Calculator"
              [route]="routePath.ThreeMfVolumeCalculator"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF Triangle Counter"
              [route]="routePath.ThreeMfTriangleCounter"
              (selected)="closeMenus()"
            />
            <app-menu-link
              label="3MF to STL Converter"
              [route]="routePath.ThreeMfToStlConverter"
              (selected)="closeMenus()"
            />
          </div>
        </section>
        <section
          class="tools-menu-after-slicing"
          aria-labelledby="after-slicing-tools-title"
        >
          <h2 id="after-slicing-tools-title" class="tools-menu-section-title">
            After slicing
          </h2>
          <app-menu-link
            label="G-code Preflight Checker"
            [route]="routePath.GcodePreflightChecker"
            (selected)="closeMenus()"
          />
        </section>
        <div class="tools-menu-footer">
          <app-menu-link
            label="View all 3D tools"
            [route]="routePath.AllTools"
            (selected)="closeMenus()"
          />
        </div>
      </div>
    </div>
    <a
      class="top-nav-link mobile-menu__link"
      [routerLink]="['/', routePath.Guides]"
      routerLinkActive="active"
      (click)="closeMenus()"
      >Guides</a
    >
    <a
      class="top-nav-link mobile-menu__link"
      [routerLink]="['/', routePath.Contact]"
      routerLinkActive="active"
      (click)="closeMenus()"
      >Contact</a
    >
  </nav>
</header>
